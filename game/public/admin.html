<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#031910"><meta name="referrer" content="no-referrer">
  <title>Battle overview · HSG Battle Arena</title>
  <link rel="icon" type="image/svg+xml" href="/game/assets/arena-mark.svg"><link rel="stylesheet" href="/game/admin.css"><script type="module" src="/game/admin.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to overview</a>
  <header class="topbar"><div class="brand"><img src="/game/assets/arena-mark.svg" width="38" height="38" alt=""><span>HSG <strong>BATTLE ARENA</strong></span></div><span class="header-tag">ROOMS / LIVE</span></header>
  <main id="main">
    <section id="overview" aria-labelledby="overview-title">
      <div class="heading"><div><p class="eyebrow">LIVE / ROOM MONITOR</p><h1 id="overview-title">Battle <em>overview.</em></h1><p class="intro">A read-only view of the arena. No battle controls here.</p></div></div>
      <div class="status-strip"><span id="connection" role="status" aria-live="polite" data-state="connecting">Connecting…</span><span id="updated">Awaiting first update</span></div>
      <div class="metrics" aria-label="Arena totals"><article><span>ACTIVE ROOMS</span><strong id="active-rooms">—</strong></article><article><span>RUNNING BATTLES</span><strong id="running-battles">—</strong></article><article><span>PLAYERS ONLINE</span><strong id="players-online">—</strong></article><article><span>ROOMS USED</span><strong id="rooms-used">— / 50</strong></article></div>
      <div class="list-heading"><div><p class="eyebrow">ARENA / ALL ROOMS</p><h2>Room roster</h2></div></div>
      <p id="room-message" class="room-message" role="status" aria-live="polite">Connecting to arena…</p><div id="rooms" class="rooms" aria-label="Rooms"></div>
    </section>
  </main>
</body>
</html>
